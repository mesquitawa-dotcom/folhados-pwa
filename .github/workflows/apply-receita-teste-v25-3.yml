name: Aplicar Receita Teste v25.3

on:
  push:
    branches:
      - agent/receita-teste-porcionamento
    paths:
      - tools/apply_receita_teste_v25_3.py
      - .github/workflows/apply-receita-teste-v25-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receita-teste-porcionamento
          fetch-depth: 0

      - name: Aplicar alteração cirúrgica
        run: python3 tools/apply_receita_teste_v25_3.py

      - name: Validar aplicação, PWA, handlers, IDs e receitas
        run: python3 tools/validate_fdo.py

      - name: Testar sincronização e merge de observações
        run: node tools/test_sync_v25_1.js

      - name: Conferir diff
        run: git diff --check

      - name: Remover ferramentas temporárias e gravar versão candidata
        run: |
          git rm tools/apply_receita_teste_v25_3.py .github/workflows/apply-receita-teste-v25-3.yml
          git add index.html sw.js tools/validate_fdo.py tools/test_sync_v25_1.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Adicionar Receita Teste rastreável v25.3"
          git push origin HEAD:agent/receita-teste-porcionamento
