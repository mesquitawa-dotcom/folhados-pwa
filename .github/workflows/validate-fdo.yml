name: Validar Folhados d'Ouro PWA

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar aplicação, PWA e receitas
        run: python3 tools/validate_fdo.py
      - name: Testar sincronização multiaparelho v25.1/v25.3
        run: node tools/test_sync_v25_1.js
      - name: Testar Receita Teste v25.3
        run: node tools/test_receita_teste_v25_3.js
      - name: Testar compatibilidade da Receita Teste v25.3
        run: node tools/test_compat_teste_v25_3.js
      - name: Testar estoque e consulta de receita v26.0
        run: node tools/test_estoque_v26_0.js
      - name: Testar receitas definitivas v26.1
        run: node tools/test_receitas_v26_1.js
      - name: Testar lembrete de estoque e batimento por receita v26.2
        run: node tools/test_v26_2.js
      - name: Testar confiabilidade e diagnóstico v26.3
        run: node tools/test_v26_3.js
      - name: Testar segurança Firebase v26.4
        run: node tools/test_v26_4.js
      - name: Testar App Check v26.5
        run: node tools/test_v26_5.js
      - name: Testar pós-laminação v26.6
        run: node tools/test_v26_6.js
      - name: Testar fluxo por formas, capacidade e sincronização v26.7
        run: node tools/test_fluxo_v26_7.js
      - name: Smoke de boot offline em navegador v26.6
        run: python3 tools/smoke_v26_6.py

  usabilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramenta de teste do navegador (somente CI)
        run: python -m pip install playwright==1.58.0
      - name: Comparar base v26.6 e testar navegação e gravações
        env:
          FDO_TEST_ARTIFACT_DIR: /tmp/fdo-usabilidade-tests
        run: |
          git show 04e3a34f6aba6436859a51b9c2c0e6216942492d:index.html > /tmp/fdo-base-v26-6.html
          python tools/test_usabilidade_v26_6_1.py --baseline /tmp/fdo-base-v26-6.html
      - name: Testar avanço do porcionamento em telas pequenas v26.6.2
        env:
          FDO_TEST_ARTIFACT_DIR: /tmp/fdo-usabilidade-tests/porcionamento
        run: |
          git show c09b652ad079a02b5bb93fac31d71d61669edde3:index.html > /tmp/fdo-base-v26-6-1.html
          python tools/test_porcionamento_v26_6_2.py --baseline /tmp/fdo-base-v26-6-1.html
      - name: Testar sequenciamento, rastreio, receita e telas v26.7
        env:
          FDO_TEST_ARTIFACT_DIR: /tmp/fdo-usabilidade-tests/fluxo
        run: |
          git show 3472acaff69bb4b09cd44f61e0bd27d0231f7726:index.html > /tmp/fdo-base-v26-6-2.html
          python tools/test_fluxo_v26_7.py --baseline /tmp/fdo-base-v26-6-2.html
      - name: Guardar evidências e telas de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usabilidade-v26-6-1
          path: /tmp/fdo-usabilidade-tests/
          retention-days: 14

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de teste das Rules
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase firebase-tools
      - name: Testar Realtime Database Rules no Emulator Suite
        run: npx firebase emulators:exec --only database --project demo-fdo-rules "node tools/test_database_rules_v26_6.js && node tools/test_fluxo_emulator_v26_7.js"
