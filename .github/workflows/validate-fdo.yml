name: Validar Folhados d'Ouro PWA

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar aplicação, PWA e receitas
        run: python3 tools/validate_fdo.py
      - name: Testar sincronização multiaparelho v25.1/v25.3
        run: node tools/test_sync_v25_1.js
      - name: Testar Receita Teste v25.3
        run: node tools/test_receita_teste_v25_3.js
      - name: Testar compatibilidade da Receita Teste v25.3
        run: node tools/test_compat_teste_v25_3.js
      - name: Testar estoque e consulta de receita v26.0
        run: node tools/test_estoque_v26_0.js
      - name: Testar receitas definitivas v26.1
        run: node tools/test_receitas_v26_1.js
      - name: Testar lembrete de estoque e batimento por receita v26.2
        run: node tools/test_v26_2.js
      - name: Testar confiabilidade e diagnóstico v26.3
        run: node tools/test_v26_3.js
      - name: Testar segurança Firebase v26.4
        run: node tools/test_v26_4.js
      - name: Testar App Check v26.5
        run: node tools/test_v26_5.js
      - name: Smoke de boot offline em navegador v26.5
        run: python3 tools/smoke_v26_5.py

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de teste das Rules
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase firebase-tools
      - name: Testar Realtime Database Rules no Emulator Suite
        run: npx firebase emulators:exec --only database --project demo-fdo-rules "node tools/test_database_rules_v26_4.js"
