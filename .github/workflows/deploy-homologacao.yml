name: Homologação FdO — testar e publicar automaticamente

on:
  push:
    branches:
      - homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdo-homologacao
  cancel-in-progress: true

jobs:
  validar:
    name: Validar produção existente e novo piloto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar estrutura, PWA e receitas
        run: python3 tools/validate_fdo.py
      - name: Executar testes de regressão
        run: |
          set -euo pipefail
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
          node tools/test_v26_2.js
          node tools/test_v26_3.js
          node tools/test_v26_4.js
          node tools/test_v26_5.js
          node tools/test_v26_6.js
          node tools/test_fluxo_v26_7.js
          node tools/test_v26_8.js
          node tools/test_ponto_piloto.js
      - name: Verificar construção isolada para outro Firebase
        run: python3 tools/test_build_homologacao.py
      - name: Preparar teste visual em Chromium
        run: python3 -m pip install playwright==1.58.0
      - name: Smoke do boot offline e do Ponto
        run: |
          python3 tools/smoke_v26_6.py
          python3 tools/smoke_ponto_v26_9.py

  regras:
    name: Validar segurança no Firebase Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDKs de testes (somente CI)
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase firebase-tools
      - name: Verificar isolamento, receitas e marcações de ponto
        run: npx firebase emulators:exec --only database --project demo-fdo-rules "node tools/test_database_rules_v26_6.js && node tools/test_fluxo_emulator_v26_7.js && node tools/test_ponto_rules.js"

  publicar:
    name: Publicar apenas no Firebase de HOMOLOGAÇÃO
    needs: [validar, regras]
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: https://${{ vars.FDO_HOMOLOG_FIREBASE_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bloquear credenciais ausentes, trocadas ou de produção
        env:
          FDO_HOMOLOG_FIREBASE_PROJECT_ID: ${{ vars.FDO_HOMOLOG_FIREBASE_PROJECT_ID }}
          FDO_HOMOLOG_FIREBASE_WEB_CONFIG: ${{ vars.FDO_HOMOLOG_FIREBASE_WEB_CONFIG }}
          FDO_HOMOLOG_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FDO_HOMOLOG_FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/preparar_credencial_homologacao.py
      - name: Construir HTML e JS com banco de testes
        env:
          FDO_HOMOLOG_FIREBASE_PROJECT_ID: ${{ vars.FDO_HOMOLOG_FIREBASE_PROJECT_ID }}
          FDO_HOMOLOG_FIREBASE_WEB_CONFIG: ${{ vars.FDO_HOMOLOG_FIREBASE_WEB_CONFIG }}
          FDO_HOMOLOG_APP_CHECK_KEY: ${{ vars.FDO_HOMOLOG_APP_CHECK_KEY }}
        run: python3 tools/build_homologacao.py
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools
      - name: Publicar Hosting e Rules EXCLUSIVAMENTE no projeto de testes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fdo-homolog-firebase-sa.json
          FDO_HOMOLOG_FIREBASE_PROJECT_ID: ${{ vars.FDO_HOMOLOG_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          firebase deploy --only hosting,database --project "$FDO_HOMOLOG_FIREBASE_PROJECT_ID" --config firebase.homologacao.json --non-interactive
      - name: Informar endereço permanente
        env:
          STAGING_PROJECT: ${{ vars.FDO_HOMOLOG_FIREBASE_PROJECT_ID }}
        run: |
          echo "### Homologação publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "Endereço: https://$STAGING_PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "A produção no GitHub Pages não foi alterada." >> "$GITHUB_STEP_SUMMARY"
