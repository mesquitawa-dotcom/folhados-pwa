name: Aplicar patch receitas v26.1

on:
  push:
    branches:
      - 'agent/receitas-definitivas-v26-1'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v26.1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receitas-definitivas-v26-1
      - name: Aplicar patch
        run: python3 tools/apply_receitas_v26_1.py
      - name: Validar patch
        run: |
          git diff --check
          python3 tools/validate_fdo.py
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
      - name: Commitar código gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/validate-fdo.yml
          git add index.html sw.js tools/validate_fdo.py tools/test_estoque_v26_0.js tools/test_compat_teste_v25_3.js tools/test_receitas_v26_1.js
          git commit -m "v26.1: receitas definitivas versionadas [v26.1-applied]"
          git push origin HEAD:agent/receitas-definitivas-v26-1
