name: Aplicar patch v26.3

on:
  push:
    branches:
      - agent/confiabilidade-v26-3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[v26.3 applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/confiabilidade-v26-3
      - name: Aplicar patch cirúrgico
        run: |
          python3 tools/apply_v26_3.py
          python3 tools/post_apply_v26_3.py
      - name: Validar aplicação e receitas
        run: python3 tools/validate_fdo.py
      - name: Executar regressões existentes
        run: |
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
          node tools/test_v26_2.js
          node tools/test_v26_3.js
      - name: Smoke de boot em navegador
        run: python3 tools/smoke_v26_3.py
      - name: Commitar patch validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js tools/validate_fdo.py vendor
          if git diff --cached --quiet; then
            echo "Nenhuma mudança a commitar"
            exit 0
          fi
          git commit -m "v26.3 — confiabilidade e diagnóstico [v26.3 applied]"
          git push origin HEAD:agent/confiabilidade-v26-3
