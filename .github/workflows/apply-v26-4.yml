name: Aplicar v26.4 Segurança Firebase

on:
  push:
    branches:
      - agent/seguranca-firebase-v26-4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[v26.4 applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguranca-firebase-v26-4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch cirúrgico v26.4
        run: |
          python3 tools/repair_apply_v26_4.py
          python3 tools/repair_retry_v26_4.py
          python3 tools/apply_v26_4.py
          python3 tools/post_retry_v26_4.py
      - name: Validar PWA, sintaxe, assets e receitas
        run: python3 tools/validate_fdo.py
      - name: Executar regressões v25.1 até v26.4
        run: |
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
          node tools/test_v26_2.js
          node tools/test_v26_3.js
          node tools/test_v26_4.js
      - name: Instalar ferramentas de teste das Rules
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase firebase-tools
      - name: Testar Rules reais no Emulator Suite
        run: npx firebase emulators:exec --only database --project demo-fdo-rules "node tools/test_database_rules_v26_4.js"
      - name: Smoke de boot offline v26.4
        run: python3 tools/smoke_v26_4.py
      - name: Commitar somente arquivos permanentes validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js database.rules.json .github/workflows/validate-fdo.yml tools/validate_fdo.py tools/test_v26_3.js tools/test_v26_4.js tools/smoke_v26_4.py tools/test_database_rules_v26_4.js
          if git ls-files --error-unmatch tools/test_database_rules_v26_3.js >/dev/null 2>&1; then
            git add -u tools/test_database_rules_v26_3.js
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma mudança permanente a commitar"
            exit 0
          fi
          git commit -m "v26.4 — segurança Firebase e históricos append-only [v26.4 applied]"
          git push origin HEAD:agent/seguranca-firebase-v26-4
