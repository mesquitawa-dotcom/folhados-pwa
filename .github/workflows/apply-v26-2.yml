name: Revisar v26.2

on:
  push:
    branches:
      - 'agent/estoque-batimento-receita-v26-2'

permissions:
  contents: write

jobs:
  review:
    if: ${{ contains(github.event.head_commit.message, '[v26.2-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estoque-batimento-receita-v26-2
      - name: Aplicar correções da revisão
        run: python3 tools/review_fix_v26_2.py
      - name: Validar revisão
        run: |
          git diff --check
          python3 tools/validate_fdo.py
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
          node tools/test_v26_2.js
      - name: Commitar revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/test_v26_2.js
          git commit -m "fix: corrigir leitura dos tempos de batimento v26.2 [v26.2-reviewed]"
          git push origin HEAD:agent/estoque-batimento-receita-v26-2
