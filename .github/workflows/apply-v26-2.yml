name: Aplicar patch v26.2

on:
  push:
    branches:
      - 'agent/estoque-batimento-receita-v26-2'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v26.2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estoque-batimento-receita-v26-2
      - name: Corrigir aplicador
        run: python3 tools/fix_apply_v26_2.py
      - name: Aplicar patch
        run: python3 tools/apply_v26_2.py
      - name: Corrigir validador gerado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_fdo.py')
          s=p.read_text(encoding='utf-8')
          old="'temposProgramados:clonarReceita','versao:'26.2''"
          new="'temposProgramados:clonarReceita',\"versao:'26.2'\""
          if old not in s:
              raise SystemExit('marcador inválido do validador não encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validar
        run: |
          git diff --check
          python3 tools/validate_fdo.py
          node tools/test_sync_v25_1.js
          node tools/test_receita_teste_v25_3.js
          node tools/test_compat_teste_v25_3.js
          node tools/test_estoque_v26_0.js
          node tools/test_receitas_v26_1.js
          node tools/test_v26_2.js
      - name: Commitar código gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js tools/validate_fdo.py tools/test_receitas_v26_1.js tools/test_v26_2.js
          git commit -m "v26.2: lembrete de estoque e batimento por receita [v26.2-applied]"
          git push origin HEAD:agent/estoque-batimento-receita-v26-2
