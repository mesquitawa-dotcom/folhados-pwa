name: Temporary finalize Firebase security v25.2

on:
  push:
    branches:
      - agent/seguranca-firebase-v25-2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguranca-firebase-v25-2
          fetch-depth: 0
      - name: Harden offline and reconnect authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: esperado 1, encontrei {n}')
              s=s.replace(old,new,1)
          once("""  liberar(comNuvem){
    if(comNuvem&&!this.cloudStarted){this.cloudStarted=true;SYNC25.init();}
    if(this.bootLiberado)return;this.bootLiberado=true;const cb=this.bootCb;if(typeof cb==='function')cb();
  },""",
          """  liberar(comNuvem){
    if(comNuvem){if(!this.cloudStarted){this.cloudStarted=true;SYNC25.init();}else if(SYNC25.iniciado)FB.aoVoltarOnline();}
    if(this.bootLiberado)return;this.bootLiberado=true;const cb=this.bootCb;if(typeof cb==='function')cb();
  },""",'liberar')
          once("""      if(!firebase.apps.length)firebase.initializeApp(FB_CFG);FB.db=firebase.database();this.auth=firebase.auth();
      let user=await this.usuarioRestaurado();""",
          """      if(!firebase.apps.length)firebase.initializeApp(FB_CFG);FB.db=firebase.database();this.auth=firebase.auth();
      try{await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
      let user=await this.usuarioRestaurado();""",'persistência auth')
          once("""      this.uid=user.uid;try{localStorage.setItem('fdo_device_uid_v25',JSON.stringify(this.uid))}catch{};this.escutar();""",
          """      this.uid=user.uid;try{localStorage.setItem('fdo_device_uid_v25',JSON.stringify(this.uid))}catch{}
      const c=this.cache();if(!navigator.onLine&&c&&c.uid===this.uid&&c.aprovado){this.registro={nome:c.nome||'',ativo:true};this.aprovado=true;this.localOnly=true;FB.status('local','Aparelho autorizado · offline');this.liberar(false);return}
      this.escutar();""",'boot offline aprovado')
          once("""  online(){
    if(this.aprovado&&this.auth&&this.auth.currentUser){if(!this.cloudStarted){this.cloudStarted=true;SYNC25.init()}else FB.aoVoltarOnline();return}
    this.iniciado=false;this.bootstrap(this.bootCb);
  }""",
          """  online(){
    this.localOnly=false;
    if(this.auth&&this.auth.currentUser){this.uid=this.auth.currentUser.uid;this.escutar();return}
    this.iniciado=false;this.bootstrap(this.bootCb);
  }""",'revalidar ao reconectar')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app and behavior
        run: |
          python3 tools/validate_fdo.py
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'setPersistence(firebase.auth.Auth.Persistence.LOCAL)' in s
          assert "!navigator.onLine&&c&&c.uid===this.uid&&c.aprovado" in s
          assert "this.uid=this.auth.currentUser.uid;this.escutar();return" in s
          assert "const CACHE='fdo-v25-2';" in Path('sw.js').read_text(encoding='utf-8')
          rules=json.loads(Path('database.rules.json').read_text(encoding='utf-8'))['rules']
          assert rules['.read'] is False and rules['.write'] is False
          assert rules['fdo_dispositivos']['$uid']['.write'] is False
          assert rules['fdo_acessos']['.read'] is False
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/fdo.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          print('Firebase security follow-up OK')
          PY
          node --check /tmp/fdo.js
          node tools/test_sync_v25_1.js
          git diff --check
      - name: Validate RTDB rules in Firebase Emulator
        run: |
          npx --yes firebase-tools@15.25.1 emulators:exec --only database --project demo-fdo "echo FIREBASE_RULES_EMULATOR_OK"
      - name: Commit final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Revalidar aparelho ao reconectar e preservar offline v25.2"
          git push origin HEAD:agent/seguranca-firebase-v25-2
