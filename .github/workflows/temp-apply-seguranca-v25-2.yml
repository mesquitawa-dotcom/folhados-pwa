name: Temporary finalize Firebase security v25.2

on:
  push:
    branches:
      - agent/seguranca-firebase-v25-2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguranca-firebase-v25-2
          fetch-depth: 0
      - name: Harden offline and reconnect authorization
        run: python3 tools/patch_offline_v25_2.py
      - name: Validate app and behavior
        run: |
          python3 tools/validate_fdo.py
          python3 -c "from pathlib import Path; import json; s=Path('index.html').read_text(encoding='utf-8'); assert 'setPersistence(firebase.auth.Auth.Persistence.LOCAL)' in s; assert '!navigator.onLine&&c&&c.uid===this.uid&&c.aprovado' in s; assert 'this.uid=this.auth.currentUser.uid;this.escutar();return' in s; r=json.loads(Path('database.rules.json').read_text(encoding='utf-8'))['rules']; assert r['.read'] is False and r['.write'] is False; assert r['fdo_dispositivos']['$uid']['.write'] is False; assert r['fdo_acessos']['.read'] is False; print('Firebase security follow-up OK')"
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S); Path('/tmp/fdo.js').write_text('\\n'.join(x for x in scripts if x.strip()),encoding='utf-8')"
          node --check /tmp/fdo.js
          node tools/test_sync_v25_1.js
          git diff --check
      - name: Validate RTDB rules in Firebase Emulator
        run: npx --yes firebase-tools@15.25.1 emulators:exec --only database --project demo-fdo "echo FIREBASE_RULES_EMULATOR_OK"
      - name: Commit final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Revalidar aparelho ao reconectar e preservar offline v25.2"
          git push origin HEAD:agent/seguranca-firebase-v25-2
