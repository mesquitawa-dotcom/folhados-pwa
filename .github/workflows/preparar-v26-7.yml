name: Preparar revisão v26.7
on:
  push:
    branches: [agent/fluxo-formas-rastreabilidade-v26-7]
    paths: [.github/workflows/preparar-v26-7.yml]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Aplicar somente sobre os hashes de base conferidos
        run: python3 tools/_apply_v267.py
      - name: Validar código e transformações antes do commit
        run: |
          python3 tools/validate_fdo.py
          node tools/test_fluxo_v26_7.js
          git diff --check
      - name: Registrar alterações reversíveis na branch de trabalho
        run: |
          rm tools/_apply_v267.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js tools/validate_fdo.py tools/test_v26_6.js tools/fluxo_v26_7_test_helper.js tools/test_fluxo_v26_7.js tools/test_fluxo_emulator_v26_7.js tools/test_fluxo_v26_7.py Resumo_v26.7.md tools/_apply_v267.py
          git commit -m 'v26.7: formas nos armários, assamento e rastreabilidade'
          git push origin HEAD:agent/fluxo-formas-rastreabilidade-v26-7
          git archive --format=zip HEAD -o /tmp/fdo-revisao-v26-7.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fdo-revisao-v26-7
          path: /tmp/fdo-revisao-v26-7.zip
          retention-days: 7
