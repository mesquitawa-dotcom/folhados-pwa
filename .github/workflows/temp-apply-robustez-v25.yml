name: Temporary apply robustez v25

on:
  push:
    branches:
      - agent/robustez-dados-v25

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/robustez-dados-v25
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/patch_robustez_v25.py

      - name: Validate JavaScript and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/fdo-inline.js').write_text(inline,encoding='utf-8')
          required=[
            "FOLHADOS D'OURO — atualização v25.0",
            "function exportarBackup()",
            "function loteAtivo(l)",
            "function restaurarLote(id)",
            "function comandoNegativo(t)",
            "id=\"sync-pill\"",
          ]
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('Marcadores ausentes: '+repr(miss))
          if "todos.slice(0,200)" in s: raise SystemExit('Ainda existe limite de 200 baldes')
          if "lams.slice(0,200)" in s: raise SystemExit('Ainda existe limite de 200 laminações')
          sw=Path('sw.js').read_text(encoding='utf-8')
          if "const CACHE='fdo-v25-0';" not in sw: raise SystemExit('Cache não atualizado')
          print('Structural validation OK')
          PY
          node --check /tmp/fdo-inline.js
          python3 -m json.tool manifest.json >/dev/null

      - name: Commit generated application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Reforçar robustez e rastreabilidade v25"
          git push origin HEAD:agent/robustez-dados-v25
